name: BedFight
main: com.example.bedfight.BedFightPlugin
version: 1.2.1
author: YourName
description: BedFight minigame with a built-in party system

commands:
  bedfight:
    description: BedFight queue, private matches, spectating and arena setup
    usage: /<command> [1v1|2v2|3v3|private|spec <player>|kiteditor|leave]
    aliases: [bf]

  party:
    description: Party system (invite, join, kick, chat, settings, ...)
    usage: /<command> [player|invite|join|leave|kick|disband|chat|mute|unmute|setting|list|limit|promote|demote|transfer]
    aliases: [p]

  pc:
    description: Party chat (toggle, or send one message)
    usage: /<command> [message]
    aliases: [partychat]

  leave:
    description: Leave the BedFight queue, match or spectator mode
    usage: /<command>
    aliases: [l]

  adminkiteditor:
    description: Edit the kit given to players in a match
    usage: /<command> [reset]
    permission: bedfight.admin

permissions:
  bedfight.play:
    description: Join the BedFight queue
    default: true
  bedfight.spectate:
    description: Spectate running matches with /bedfight spec <player>
    default: true
  bedfight.admin:
    description: Arena setup commands
    default: op
  bedfight.rank.mvpplusplus:
    description: MVP++ rank, allowed to create private matches
    default: false
