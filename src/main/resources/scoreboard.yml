# BedFight scoreboard settings  (reload with /bedfight reload)
#
# - Colors use &-codes. Max 15 lines. 1.8 limits a line to about 32 visible characters (colors count).
# - "update-ticks": 20 = once per second, which keeps the ping numbers live.
# - An empty line "" is a blank spacer.
# - The board opens when a player is IN a game (match or spectating). Queued players keep their current board.
# - The "queue:" section below is not used any more.
#
# Placeholders for "match.lines" and "spectator.lines":
#   %mode%  %map%  %team%  %status%  %countdown%  %time%
#   %player%  %opponent%  %ping% (your ping)  %opponent_ping% (average ping of the enemy team)
#   %kills%  %bed_breaks%  %ip%  %spectators%
#   %teams%  -> replaced by one line per team (see "team-line" below)
# Placeholders for "queue.lines":
#   %player%  %mode%  %queued%  %needed%  %queue_time%  %ping%  %ip%
# Placeholders for "team-line":
#   %color%  %letter%  %name%  %team_status%  %you%

enabled: true
update-ticks: 20
ip: "Play.MineStorm.IR"

# Style: magenta bold title, white labels, magenta values, gray separators (like the EU Practice board)
match:
  title: "&d&lMINESTORM"
  lines:
    - "&7&m------------------"
    - "%teams%"
    - ""
    - "&fKills: &d%kills%"
    - ""
    - "&fYour Ping: &d%ping% ms"
    - "&fTheir Ping: &d%opponent_ping% ms"
    - ""
    - "&d%ip%"
    - "&7&m------------------"
  # one line per team, e.g. "B Blue: \u2714 YOU"
  team-line: "%color%%letter% &f%name%: %team_status%%you%"
  # shown while the team's bed is alive
  bed-alive: "&a\u2714"
  # shown after the bed is destroyed: number of players still alive on that team
  bed-dead: "&a%alive%"
  # shown when the whole team is eliminated
  eliminated: "&c\u2718"
  # appended to your own team's line
  you: " &7YOU"

queue:
  title: "&d&lMINESTORM"
  lines:
    - "&7&m------------------"
    - "&fMode: &d%mode%"
    - "&fQueued: &d%queued%&f/&d%needed%"
    - "&fWaiting: &d%queue_time%"
    - ""
    - "&fYour Ping: &d%ping% ms"
    - ""
    - "&d%ip%"
    - "&7&m------------------"

spectator:
  title: "&d&lMINESTORM"
  lines:
    - "&7&m------------------"
    - "%teams%"
    - ""
    - "&fTime: &d%time%"
    - "&fSpectators: &d%spectators%"
    - ""
    - "&7You are spectating"
    - ""
    - "&d%ip%"
    - "&7&m------------------"
